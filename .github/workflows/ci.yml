name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: omnidesk
          POSTGRES_PASSWORD: omnidesk_ci
          POSTGRES_DB: omnidesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnidesk"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://omnidesk:omnidesk_ci@localhost:5432/omnidesk?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Build
        run: go build ./cmd/api
