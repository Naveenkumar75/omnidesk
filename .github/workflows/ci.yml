name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: omnidesk
          POSTGRES_PASSWORD: omnidesk_ci
          POSTGRES_DB: omnidesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnidesk"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://omnidesk:omnidesk_ci@localhost:5432/omnidesk?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Build
        run: go build ./cmd/api

  ai:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: omnidesk
          POSTGRES_PASSWORD: omnidesk_ci
          POSTGRES_DB: omnidesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnidesk"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://omnidesk:omnidesk_ci@localhost:5432/omnidesk?sslmode=disable
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests (unit, pgvector integration, retrieval eval gate)
        run: python -m pytest -q
