openapi: 3.0.3
info:
  title: OmniDesk API
  version: 1.0.0
  description: |
    Multi-tenant customer-support API. Every authenticated request is scoped to
    the tenant in the caller's JWT; a resource belonging to another tenant is
    reported as 404, never 403, so its existence is not revealed.

    The AI service (knowledge base, reply suggestions) has its own spec at
    `http://<ai-host>/openapi.json`, generated by FastAPI.
servers:
  - url: http://localhost:8080
tags:
  - name: health
  - name: auth
  - name: users
  - name: tickets

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness (the process is up)
      responses:
        "200": { description: OK }
  /readyz:
    get:
      tags: [health]
      summary: Readiness (the database is reachable)
      responses:
        "200": { description: Ready }
        "503": { $ref: "#/components/responses/Error" }
  /openapi.yaml:
    get:
      tags: [health]
      summary: This document
      responses:
        "200": { description: OpenAPI document }

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Create a tenant and its first admin (one transaction)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_name, domain, email, password]
              additionalProperties: false
              properties:
                tenant_name: { type: string, maxLength: 255 }
                domain: { type: string, maxLength: 255, example: acme.test }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 72, description: "bytes; bcrypt limit" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id: { type: integer }
                  user_id: { type: integer }
                  role: { type: string, enum: [admin] }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Exchange email and password for a JWT (24h)
      description: |
        Unknown email and wrong password return the same 401 after the same
        amount of work. Limited per email (5 attempts, then 1 per 12s) and per client IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/me:
    get:
      tags: [auth]
      summary: Identity from the token
      security: [{ bearer: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: integer }
                  tenant_id: { type: integer }
                  role: { $ref: "#/components/schemas/Role" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/users:
    get:
      tags: [users]
      summary: List users in the caller's tenant
      security: [{ bearer: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [users]
      summary: Add a user to the caller's tenant (admin only)
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 72 }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/tickets:
    post:
      tags: [tickets]
      summary: Create a ticket (SLA deadlines are set from its priority)
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, requester_email]
              additionalProperties: false
              properties:
                subject: { type: string, maxLength: 255 }
                description: { type: string, maxLength: 20000 }
                requester_email: { type: string, format: email }
                priority: { $ref: "#/components/schemas/Priority" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    get:
      tags: [tickets]
      summary: List the tenant's tickets, newest first (keyset pagination)
      security: [{ bearer: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/Status" } }
        - name: assignee
          in: query
          description: "`me`, `none`, or a user id"
          schema: { type: string }
        - { name: breached, in: query, schema: { type: boolean }, description: Only tickets that missed an SLA }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: integer }, description: "`next_cursor` from the previous page" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tickets:
                    type: array
                    items: { $ref: "#/components/schemas/Ticket" }
                  next_cursor: { type: integer, nullable: true }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/tickets/{id}:
    get:
      tags: [tickets]
      summary: Ticket with its audit trail and comments
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/TicketID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket: { $ref: "#/components/schemas/Ticket" }
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/TicketEvent" }
                  comments:
                    type: array
                    items: { $ref: "#/components/schemas/Comment" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/tickets/{id}/transition:
    post:
      tags: [tickets]
      summary: Change status (open → pending ↔ open → resolved → closed; resolved may reopen)
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/TicketID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status: { $ref: "#/components/schemas/Status" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/tickets/{id}/assignee:
    put:
      tags: [tickets]
      summary: Assign to a user in the same tenant, or unassign with null
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/TicketID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignee_id]
              additionalProperties: false
              properties:
                assignee_id: { type: integer, nullable: true }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/tickets/{id}/comments:
    post:
      tags: [tickets]
      summary: Add a public reply or an internal note
      description: The first public reply stops the first-response SLA clock.
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/TicketID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              additionalProperties: false
              properties:
                body: { type: string, maxLength: 20000 }
                internal: { type: boolean, default: false }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TicketID:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many attempts
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds to wait }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    Role: { type: string, enum: [admin, agent], default: agent }
    Status: { type: string, enum: [open, pending, resolved, closed] }
    Priority: { type: string, enum: [low, normal, high, urgent], default: normal }
    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        created_at: { type: string, format: date-time }
    Ticket:
      type: object
      properties:
        id: { type: integer }
        tenant_id: { type: integer }
        subject: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        priority: { $ref: "#/components/schemas/Priority" }
        requester_email: { type: string }
        created_by: { type: integer }
        assignee_id: { type: integer, nullable: true }
        first_response_due_at: { type: string, format: date-time }
        resolution_due_at: { type: string, format: date-time }
        first_response_at: { type: string, format: date-time, nullable: true }
        first_response_breached_at: { type: string, format: date-time, nullable: true }
        resolution_breached_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TicketEvent:
      type: object
      properties:
        kind: { type: string, enum: [status_change, first_response_breach, resolution_breach] }
        from_status: { allOf: [{ $ref: "#/components/schemas/Status" }], nullable: true }
        to_status: { allOf: [{ $ref: "#/components/schemas/Status" }], nullable: true }
        actor_id: { type: integer, nullable: true, description: null for system events }
        created_at: { type: string, format: date-time }
    Comment:
      type: object
      properties:
        id: { type: integer }
        author_id: { type: integer }
        body: { type: string }
        internal: { type: boolean }
        created_at: { type: string, format: date-time }
